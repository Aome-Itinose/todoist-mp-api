version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB}
    ports:
      - "${POSTGRES_LOCAL_PORT}:${POSTGRES_DOCKER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
    volumes:
      - .m2:/root/.m2
    stdin_open: true
    tty: true

volumes:
  postgres_data:
