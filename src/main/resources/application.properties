spring.application.name=todoist-mp-api

security.jwt.secret=${SECURITY_SECRET}
security.jwt.issuer=${SECURITY_ISSUER}
security.jwt.expiration=${SECURITY_EXPIRATION}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:${POSTGRES_DOCKER_PORT}/${DB}

server.port=${SPRING_LOCAL_PORT}
